name: Release evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    outputs:
      event-commit: ${{ steps.source.outputs.commit }}
    concurrency:
      group: relay-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELAY_MIGRATION_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay
      RELAY_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay
      RELAY_TEST_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay_test
      PGPASSWORD: relay_dev_password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_dev_password
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
        with:
          version: 10.30.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify immutable release source and main ancestry
        id: source
        run: |
          git fetch origin main --depth=1
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled != "" ? peeled : direct }')"
          test -n "$remote_tag_commit"
          test "$remote_tag_commit" = "$event_commit"
          git merge-base --is-ancestor "$event_commit" origin/main
          echo "commit=$event_commit" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run db:migrate
      - run: pnpm run db:seed
      - run: createdb -h 127.0.0.1 -p 54329 -U relay relay_test
      - run: pnpm test
      - run: pnpm run audit:prod
      - name: Build package and CycloneDX SBOM
        run: |
          mkdir artifacts
          pnpm pack --pack-destination artifacts
          pnpm run sbom
          pnpm run check:release-evidence -- --tag "${RELEASE_TAG}" --artifacts artifacts
          node scripts/verify-release-consumer.mjs --tarball artifacts/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-release-evidence-${{ github.ref_name }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  attest-and-publish:
    needs: build-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      EVENT_COMMIT: ${{ needs.build-evidence.outputs.event-commit }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: relay-release-evidence-${{ github.ref_name }}
          path: artifacts
      - name: Verify tag was not moved before attestation or publication
        run: |
          remote_tag_commit="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled != "" ? peeled : direct }')"
          test -n "$remote_tag_commit"
          test "$remote_tag_commit" = "$EVENT_COMMIT"
      - uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4.1.0
        with:
          subject-path: artifacts/*.tgz
      - uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4.1.0
        with:
          subject-path: artifacts/*.tgz
          sbom-path: artifacts/relay.cdx.json
      - name: Publish release assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_assets="$(find artifacts -maxdepth 1 -type f -exec basename {} \; | sort)"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets)"
            draft="$(printf '%s' "$release_state" | jq -r '.isDraft')"
            existing_assets="$(printf '%s' "$release_state" | jq -r '.assets[].name' | sort)"
            if [[ "$draft" != "true" ]]; then echo "Release ${RELEASE_TAG} is already published; refusing to replace evidence." >&2; exit 1; fi
            if [[ -z "$existing_assets" ]]; then
              gh release upload "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}"
            elif [[ "$existing_assets" != "$expected_assets" ]]; then
              echo "Release ${RELEASE_TAG} has unexpected draft assets; refusing to mix evidence." >&2; exit 1
            fi
          elif [[ -z "$expected_assets" ]]; then
            echo "No release evidence assets were produced." >&2; exit 1
          else
            gh release create "${RELEASE_TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --generate-notes
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

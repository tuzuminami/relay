name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_dev_password
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.30.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:private-boundary
      - run: pnpm run build
      - run: pnpm run db:migrate
        env:
          RELAY_MIGRATION_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay
      - run: pnpm run db:seed
        env:
          RELAY_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay
      - run: createdb -h 127.0.0.1 -p 54329 -U relay relay_test
        env:
          PGPASSWORD: relay_dev_password
      - run: pnpm test
        env:
          RELAY_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay
          RELAY_TEST_DATABASE_URL: postgres://relay:relay_dev_password@127.0.0.1:54329/relay_test
